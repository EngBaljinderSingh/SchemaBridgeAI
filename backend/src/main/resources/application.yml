server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: schemabridge-backend
  profiles:
    active: local
  datasource:
    url: jdbc:h2:file:./data/schemabridge;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false # Enabled in postgres profile for production migrations
  jackson:
    serialization:
      write-dates-as-timestamps: false

schemabridge:
  version: "1.0.0"
  service-code: "SB-AI-CORE"
  aviator:
    base-url: ${AVIATOR_BASE_URL:http://localhost:3000}
    connect-timeout-ms: 5000
    read-timeout-ms: 25000
    mock-fallback-enabled: true
  matching:
    thresholds:
      high-confidence: 0.90
      medium-confidence: 0.70
  security:
    cors:
      allowed-origins: "http://localhost:4200,http://localhost:8080,http://localhost:3000"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
