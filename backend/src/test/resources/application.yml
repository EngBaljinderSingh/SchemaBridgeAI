spring:
  datasource:
    url: jdbc:h2:mem:schemabridge_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

schemabridge:
  version: "1.0.0"
  service-code: "SB-AI-CORE"
  aviator:
    base-url: http://localhost:3000
    mock-fallback-enabled: true
  matching:
    thresholds:
      high-confidence: 0.90
      medium-confidence: 0.70
